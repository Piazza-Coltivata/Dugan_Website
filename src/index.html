<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23dc2626'/><text x='50' y='65' font-size='60' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'>SG</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strong Guys Moving</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Static form so Netlify's build bot can detect and register it; the real form is submitted via fetch in ContactPage -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/FrontEnd/main.jsx"></script>
  </body>
</html>
